site:
  title: Related docs fixture
  start_page: fixture::index.adoc
content:
  sources:
    - url: ./../..
      branches: HEAD
      start_path: test/fixture/docs
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
urls:
  html_extension_style: indexify
antora:
  extensions:
    - require: ./../../lib/index.js
      sites:
        - name: Team docs
          url: https://team.docs.example.org
          audience: team
          requires_login: true
          login_note: GitHub org membership
        - name: Partner portal
          url: https://partners.example.org
          audience: partners
